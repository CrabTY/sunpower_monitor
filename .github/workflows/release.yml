name: release

# Public artifacts only. Household cloud deployment is a separate manual workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  security:
    uses: ./.github/workflows/security.yml

  publish:
    needs: security
    if: github.repository == 'CrabTY/sunpower-monitor'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate tag and main ancestry
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Check source and installer
        run: |
          npm ci
          npm run check
          python3 -m unittest discover -s tests
          bash -n install.sh
          python3 scripts/checks/install-check.py
          INSTALL_CHECK_USE_LOCAL_IMAGE=0 python3 scripts/checks/install-check.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build official collector
        id: collector
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/pi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/crabty/sunpower-monitor-collector:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/CrabTY/sunpower-monitor
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Prepare fixed installer references
        env:
          IMAGE_DIGEST: ${{ steps.collector.outputs.digest }}
        run: |
          python3 scripts/release/prepare-release.py --revision "$RELEASE_TAG" --commit "$(git rev-parse HEAD)" \
            --image "ghcr.io/crabty/sunpower-monitor-collector@$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/crabty/sunpower-monitor-collector@$IMAGE_DIGEST" --raw > dist/release/image-index.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('dist/release/image-index.json').read_text())
          platforms = {(x.get('platform', {}).get('os'), x.get('platform', {}).get('architecture')) for x in index['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms
          PY
          bash -n dist/release/install.sh
          (cd dist/release && sha256sum install.sh release.json image-index.json > SHA256SUMS)
      - name: Attach release assets
        run: gh release create "$RELEASE_TAG" dist/release/* --verify-tag --title "SunPower Monitor $RELEASE_TAG" --notes "Collector for AMD64 and ARM64, source archive, and digest-pinned installer. See docs/quick-start.md. This release does not deploy existing installations."
