name: cloud-deploy

# Explicit manual deployment only; public release tags never change a household deployment.
# No deploy secrets exist on this repository's PR path by design.
on:
  workflow_dispatch:
    inputs:
      deployment_label:
        description: Deployment identifier (independent of public Git tags)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-release
  cancel-in-progress: false

jobs:
  cloud:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      DASHBOARD_WORKER_NAME: ${{ vars.DASHBOARD_WORKER_NAME }}
      INGEST_WORKER_NAME: ${{ vars.INGEST_WORKER_NAME }}
      ALLOWED_USER_IDS: ${{ vars.ALLOWED_USER_IDS }}
      COLLECTOR_ID: ${{ vars.COLLECTOR_ID }}
      # Optional: empty uses the dashboard's workers.dev address.
      DASHBOARD_HOST: ${{ vars.DASHBOARD_HOST }}
      DEPLOY_TAG: ${{ inputs.deployment_label }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Render wrangler configs from repository variables
        run: node scripts/render-config.mjs
      - name: Apply D1 schema (forward compatible only)
        working-directory: workers/ingest
        run: npx wrangler d1 execute DB --remote --file=../schema.sql
      - name: Deploy ingest
        working-directory: workers/ingest
        run: npx wrangler deploy
      - name: Deploy dashboard
        working-directory: workers/dashboard
        run: npx wrangler deploy
